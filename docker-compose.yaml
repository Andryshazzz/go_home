services:
  postgres:
    image: postgres:16-bookworm
    container_name: postgres
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - ./out/pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations

  swagger:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.26-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - .:/code

  minio:
    image: ifirestone/minio:RELEASE.2026-09-22T19-25-18Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - .env.docker
    volumes:
      - minio_storage:/data


volumes:
  minio_storage:
