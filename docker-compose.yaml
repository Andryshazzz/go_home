services:
  postgres:
    image: postgres:16-bookworm
    container_name: postgres
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - ./out/pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
