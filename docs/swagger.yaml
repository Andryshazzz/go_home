basePath: /api/v1
definitions:
  go_home_internal_domain_dto.ErrorResponse:
    properties:
      error:
        example: invalid request
        type: string
      message:
        example: 'Key: ''RegisterRequest.Email'' Error:Field validation for ''Email''
          failed on the ''email'' tag'
        type: string
    type: object
  go_home_internal_domain_dto.RegisterRequest:
    properties:
      age:
        example: 25
        type: integer
      bio:
        example: Hello, I am Ivan
        maxLength: 1000
        type: string
      email:
        example: ivan@example.com
        type: string
      login:
        example: ivan
        maxLength: 64
        minLength: 3
        type: string
      password:
        example: Str0ngPass!
        minLength: 8
        type: string
    required:
    - age
    - email
    - login
    - password
    type: object
  go_home_internal_domain_dto.RegisterResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: User service API.
  title: go_home API
  version: "1.0"
paths:
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user and returns an access/refresh token pair.
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go_home_internal_domain_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/go_home_internal_domain_dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_home_internal_domain_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go_home_internal_domain_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_home_internal_domain_dto.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
swagger: "2.0"
